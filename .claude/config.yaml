# Agentic workflow configuration
# Human-maintained. Read by commands and skills. Never modified by agents.

# Prefix for spec IDs. Format: <prefix>-<####>, always 4 digits, zero-padded.
project_prefix: cm

# Branch that feature branches target. PRs open against this branch.
default_branch: develop

# Protected branches. Agents must never check out, merge to, or push to these.
protected_branches:
    - main

# Where /implement creates worktrees. Relative to the repo root.
# This directory should be added to .gitignore.
worktree_root: ./worktrees

# Minimum unit test coverage percentage for /test auto-approval.
min_coverage: 70
