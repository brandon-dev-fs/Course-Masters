services:
    db:
        image: postgres:17-alpine
        environment:
            POSTGRES_USER: coursemasters
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: coursemasters
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U coursemasters']
            interval: 5s
            timeout: 5s
            retries: 5

    server:
        build:
            context: .
            dockerfile: server/Dockerfile
        depends_on:
            db:
                condition: service_healthy
            garage:
                condition: service_started
        environment:
            DATABASE_URL: postgresql://coursemasters:${POSTGRES_PASSWORD}@db:5432/coursemasters
            BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
            SERVER_PORT: '5002'
            NODE_ENV: production
            CLIENT_URL: http://localhost:5000
            LOG_LEVEL: info
            SEED_DB: 'true'
            S3_ENDPOINT: http://garage:3900
            S3_BUCKET: ${S3_BUCKET:-course-masters}
            S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
            S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
            S3_REGION: garage
        ports:
            - '5002:5002'

    client:
        build:
            context: .
            dockerfile: client/Dockerfile
        depends_on:
            - server
        ports:
            - '5000:80'

    garage:
        image: dxflrs/garage:v1.0.0
        volumes:
            - garage_meta:/var/lib/garage/meta
            - garage_data:/var/lib/garage/data
            - ./garage.toml:/etc/garage.toml:ro
        ports:
            - '3900:3900'
            - '3902:3902'

volumes:
    postgres_data:
    garage_meta:
    garage_data:
